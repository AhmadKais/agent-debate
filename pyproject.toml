[project]
name = "agent-debate"
version = "1.00"
description = "AI Agent Debate System — Pro vs Con judged by an LLM arbiter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.1",
    "ddgs>=9.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "matplotlib>=3.10.9",
]

[project.scripts]
debate = "main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "src/**/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
